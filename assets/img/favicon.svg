    <rect x="6" y="8" width="20" height="3" rx="1.5" fill="#FFFFFF"/>
    <circle cx="8" cy="16" r="1.75" fill="#FFFFFF"/>
    <circle cx="13.33" cy="16" r="1.75" fill="#FFFFFF"/>
    <circle cx="18.67" cy="16" r="1.75" fill="#FFFFFF"/>
    <circle cx="24" cy="16" r="1.75" fill="#FFFFFF"/>
    <rect x="6" y="21" width="20" height="3" rx="1.5" fill="#FFFFFF"/>
</svg>
