<svg xmlns="http://www.w3.org/2000/svg">
    <!-- Icon sprite of Composites Playground: 24 px grid, 2 px round strokes.
         Use: <svg class="icon"><use href="icons.svg#check"></use></svg> -->
    <symbol id="check" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5"/>
    </symbol>
    <symbol id="cross" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="minus" viewBox="0 0 24 24">
        <path d="M5 12h14"/>
    </symbol>
    <symbol id="trash" viewBox="0 0 24 24">
        <path d="M4 7h16M10 11v6M14 11v6"/>
        <path d="m6 7 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/>
        <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </symbol>
    <!-- Mirror: a shape above the dashed mid-plane and its image below. -->
    <symbol id="mirror" viewBox="0 0 24 24">
        <path d="M3 12h2M9 12h2M13 12h2M19 12h2"/>
        <path d="M7 9l5-5 5 5z"/>
        <path d="M7 15l5 5 5-5z"/>
    </symbol>
    <symbol id="link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
        <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
    </symbol>
    <symbol id="image" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="9" cy="9" r="2"/>
        <path d="m21 15-5-5L5 21"/>
    </symbol>
    <symbol id="download" viewBox="0 0 24 24">
        <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
    </symbol>
    <symbol id="rotate" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <path d="M21 4v5h-5"/>
    </symbol>
    <symbol id="chevron" viewBox="0 0 24 24">
        <path d="m9 6 6 6-6 6"/>
    </symbol>
    <symbol id="info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 11v5M12 8h.01"/>
    </symbol>
    <symbol id="external" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9"/>
        <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
    </symbol>
    <symbol id="play" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
    </symbol>
</svg>
