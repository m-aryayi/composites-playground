<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ply stack demo · Composites Playground</title>
    <meta name="theme-color" content="#00785A">
    <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/site.css">
    <link rel="stylesheet" href="../../assets/css/lesson.css">
    <script type="importmap">
    {
        "imports": {
            "three": "../../vendor/three/build/three.module.js",
            "three/addons/": "../../vendor/three/examples/jsm/"
        }
    }
    </script>
    <style>
        /* Layout of this test page only. */
        .demo {
            padding-block: var(--space-6) var(--space-8);
        }

        .demo__controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-2);
            margin-block: var(--space-4);
        }

        .demo__frame {
            display: grid;
            height: min(70vh, 40rem);
            padding: 0;
            overflow: hidden;
        }

        .demo__readout {
            margin-top: var(--space-3);
            color: var(--muted);
            font-size: var(--text-sm);
        }
    </style>
</head>
<body class="site">
<main class="container demo">
    <h1>Ply stack demo</h1>
    <p class="demo__readout">Test page of the 3D ply stack (module T1.3). Compare
        with the Python app: <code>.venv/Scripts/python.exe
        python/laminate_symmetry.py</code></p>

    <div class="demo__controls" id="stacks" role="group" aria-label="Test stacks"></div>

    <div class="card demo__frame">
        <div class="stage__view" id="view">
            <span class="stage__hint">Drag to rotate · scroll to zoom</span>
        </div>
    </div>
    <p class="demo__readout" id="readout" aria-live="polite"></p>
    <div class="demo__controls">
        <button class="btn" type="button" id="reset">Reset view</button>
    </div>
</main>

<script type="module">
    // Ply stack demo: six test stacks and a ply selection.
    import { el, qs } from "../../assets/js/core/dom.js";
    import { formatAngle } from "../../tools/laminate-symmetry/model.js";
    import { createStackView } from "../../tools/laminate-symmetry/view-stack.js";

    const TEST_STACKS = Object.freeze([
        [0, 45, 90],
        [0, 90, 90, 0],
        [0, 90],
        [45, -45],
        [0, 45, 90, 90, 45, 0],
        [0, 45, -45, 90, 30, -60, -60, 30, 90, -45, 45, 0],
    ]);

    /** Return a stack as short text, for example "[0/+45/90]". */
    function stackName(angles) {
        return `[${angles.map((a) => formatAngle(a).replace("°", "")).join("/")}]`;
    }

    /** Start the demo. */
    function main() {
        let state = { angles: TEST_STACKS[0], selected: 0 };
        const stack = createStackView(qs("#view"), {
            onSelect: (index) => show({ ...state, selected: index }),
        });

        /** Draw a state and write it below the view. */
        function show(next) {
            state = next;
            stack.update(state);
            const angle = formatAngle(state.angles[state.selected]);
            qs("#readout").textContent = `Stack ${stackName(state.angles)} · selected: `
                + `ply ${state.selected + 1} of ${state.angles.length} (${angle})`;
        }

        for (const angles of TEST_STACKS) {
            const button = el("button", { className: "btn", text: stackName(angles),
                                          attrs: { type: "button" } });
            button.addEventListener("click", () => show({ angles, selected: 0 }));
            qs("#stacks").append(button);
        }
        qs("#reset").addEventListener("click", () => stack.view.resetView());
        show(state);
        window.demo = { stack, get state() { return state; } };   // for the tests
    }

    main();
</script>
</body>
</html>
